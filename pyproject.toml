[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mlwatcher"
version = "0.2.0"
description = "A lightweight logging dashboard for monitoring ML training or any long-running Python process, locally or remotely."
authors = [{name = "Sai Sreenadh Chilukuri", email = "saisrinadhch@gmail.com"}]
license = "MIT"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "Flask",
    "requests"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Flask",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3"
]

[project.urls]
"Homepage" = "https://github.com/UrTechTips/mlwatcher"
"Bug Tracker" = "https://github.com/UrTechTips/mlwatcher/issues"

[tool.setuptools]
include-package-data = true

[tool.setuptools.package-data]
"mlwatcher" = ["templates/*.html"]

[tool.setuptools.packages.find]
where = ["mlwatcher"]
